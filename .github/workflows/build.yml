
name: Build BehnaM Trading Journal APK

on:
  workflow_dispatch:
  push:
    paths:
      - '**.zip'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find source -type f -name settings.gradle | head -n 1)")
          test -n "$PROJECT_DIR"
          gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BehnaM-Trading-Journal-APK
          path: source/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
